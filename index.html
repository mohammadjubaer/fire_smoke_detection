<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Fire & Smoke Detector - YOLOv10</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        color: #e2e8f0;
        z-index: 9999;
      }
      #loading .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #334155;
        border-top-color: #f97316;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      noscript {
        color: #e2e8f0;
        text-align: center;
        padding: 20px;
      }
    </style>
    <!-- Load ONNX Runtime from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.21.0/dist/ort.min.js"></script>
  </head>
  <body>
    <div id="root">
      <div id="loading">
        <div class="spinner"></div>
        <div>Loading Fire & Smoke Detector...</div>
      </div>
    </div>
    <noscript>
      <h2>JavaScript Required</h2>
      <p>This application requires JavaScript to run. Please enable JavaScript in your browser settings.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
